<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title> Home </title>
    <link href="style.css" rel="stylesheet" type="text/css" />

</head>

<body onload="begin()">
    <div class="card">
        <h1>Guess the missing word</h1>

        <h3 id="story">
        </h3>

        <p id="site">
        </p>

        <br>

        <p id="attempts">
        </p>
        <p id="response">
            Guess Below
        </p>

        <input type="text" maxlength="30" id="input">

        <div id="center">
            <button onclick="guess()">
                SUBMIT
            </button>

            <button onclick="next()" id="next">
                NEXT
            </button>
        </div>

        <br>
        <button onclick="location.href='previous.html'">
            PREVIOUS QUESTIONS
        </button>
    </div>
    <script src="script.js" type="text/javascript"></script>
</body>

</html>
